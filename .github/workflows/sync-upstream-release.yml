name: Sync upstream release

on:
  schedule:
    # Upstream releases are infrequent. Check hourly; a run with nothing new
    # exits without touching the repository.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag to sync (leave empty for the latest stable release)'
        required: false
        type: string
      dry_run:
        description: 'Build the merge and release commit, but do not push or release'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: RobHofmann/HomeAssistant-GreeClimateComponent
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: .github/scripts/sync_upstream_release.sh
